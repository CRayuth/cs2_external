<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0d12">
    <title>YUT &mdash; Vesta Device Controller</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="stage">
        <div class="menu">
            <aside class="sidebar">
                <div class="brand">YUT</div>
                <nav id="nav"></nav>
                <div class="side-foot">
                    <div class="stat"><span class="dot" id="dot"></span><span id="stat-text">connecting...</span></div>
                    <div class="mini" id="mini"></div>
                </div>
            </aside>
            <section class="content">
                <div class="tabs" id="tabs"></div>
                <div class="cards" id="cards"></div>
            </section>
        </div>

        <div class="dock">
            <input id="search" type="search" placeholder="Search every setting..." autocomplete="off">
            <button id="btn-start" class="btn primary">Start Vesta</button>
            <button id="btn-stop" class="btn">Stop Vesta</button>
            <button id="btn-reinstall" class="btn">Reinstall bridge</button>
            <label class="toggle-label">
                <button id="auto-toggle" class="switch" type="button" aria-label="Auto-launch on CS2"></button>
                <span>Auto-launch on CS2</span>
            </label>
            <span class="sync" id="sync"></span>
        </div>

        <div id="notice" class="notice" hidden></div>
    </div>

    <script src="/app.js"></script>

    <template id="icon-aimbot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <circle cx="12" cy="12" r="7" />
            <path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4" />
            <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none" />
        </svg>
    </template>
    <template id="icon-triggerbot">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M13 2 4.5 13.2H11l-1.4 8.8 8.9-11.6H12z" />
        </svg>
    </template>
    <template id="icon-visuals">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M1.8 12S5.6 5.2 12 5.2 22.2 12 22.2 12 18.4 18.8 12 18.8 1.8 12 1.8 12Z" />
            <circle cx="12" cy="12" r="3.1" />
        </svg>
    </template>
    <template id="icon-misc">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="3" y="3" width="7.6" height="7.6" rx="1.8" />
            <rect x="13.4" y="3" width="7.6" height="7.6" rx="1.8" />
            <rect x="3" y="13.4" width="7.6" height="7.6" rx="1.8" />
            <rect x="13.4" y="13.4" width="7.6" height="7.6" rx="1.8" />
        </svg>
    </template>
</body>
</html>
