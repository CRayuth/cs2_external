name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Upload built binaries
        uses: actions/upload-artifact@v4
        with:
          name: vesta-windows-x64
          path: |
            build/bin/vesta.exe
            build/bin/vesta_hvh.dll
          if-no-files-found: error
